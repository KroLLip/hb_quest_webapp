<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dev Birthday Quest</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js?v=1.0.1"></script>
    <!-- Pyodide (Python в браузере) с версией от кэша -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js?v=1.0.1"></script>
    <!-- Canvas Confetti для победного салюта -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js?v=1.0.1"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --err-color: #f87171;
            --success-color: #4ade80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            height: 100vh;
            height: 100dvh; /* Динамическая высота под клавиатуру */
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding: 6px;
            background: var(--panel-bg);
            border-radius: 8px;
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }

        .header h1 {
            font-size: 14px;
            color: var(--accent-color);
        }

        .header p {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 4px;
            min-height: 0; /* Разрешает flex-элементу сжиматься */
            position: relative;
        }

        label {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            flex: 1;
            background-color: #090d16;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px;
            font-size: 12px;
            line-height: 1.3;
            resize: none;
            outline: none;
            white-space: pre;
            tab-size: 4;
            min-height: 0;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        button {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        button:active {
            opacity: 0.8;
        }

        /* Обновленные стили терминала: чуть выше и у́же */
        .console-container {
            height: 115px; /* Увеличено с 80px до 115px (повыше) */
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .console {
            flex: 1;
            background-color: #050811;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 4px 6px; /* Компактные узкие отступы */
            font-size: 9.5px; /* Чуть более компактный шрифт */
            line-height: 1.2; /* Узкий межстрочный интервал */
            overflow-y: auto;
            color: #a7f3d0;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .err {
            color: var(--err-color);
        }

        .success {
            color: var(--success-color);
        }

        /* Авто-скрытие хедера при вводе кода для экономии места */
        body.editing .header {
            display: none;
        }

        /* Модальное окно победы */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            z-index: 100;
            padding: 24px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 16px;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--accent-color);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            position: relative;
        }

        .modal h2 {
            color: var(--accent-color);
            margin-bottom: 12px;
        }

        .modal p {
            font-size: 13px;
            line-height: 1.5;
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        /* Кнопка закрытия модалки крестиком */
        .close-modal-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
        }

        .close-modal-btn:hover {
            color: var(--text-color);
        }

        /* Плавающая кнопка-стрелочка для повторного открытия модалки победы */
        #toggle-win-btn {
            display: none;
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: var(--success-color);
            color: #0f172a;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(74, 222, 128, 0.4);
            z-index: 50;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        #toggle-win-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

<div class="header" id="header-block">
    <h1>🔒 DEBUG QUEST: UNLOCK LOOT</h1>
    <p>Отладить закрытый вызов функции и обойти защиту сервера</p>
</div>

<div class="editor-container">
    <label>solution.py</label>
    <textarea id="code" spellcheck="false"># Напиши свой код отладки ниже.
# Главная цель: вызвать get_birthday_loot(...) без ошибок!

from secret_guard import get_birthday_loot

def solution():
    # Начни отсюда: перехватывай исключения или передавай аргументы
    return get_birthday_loot()
</textarea>
    <!-- Плавающая кнопка для открытия/скрытия окна победы -->
    <button id="toggle-win-btn" onclick="toggleWinModal()" title="Открыть результат победы">🎉</button>

    <button id="run-btn" onclick="runPython()">
        <span>▶ EXECUTE CODE</span>
    </button>
</div>

<div class="console-container" id="console-block">
    <label>Terminal / Stdout & Stderr</label>
    <div id="console" class="console">Инициализация Python среды...</div>
</div>

<!-- Модалка с победой -->
<div id="win-modal" class="modal">
    <div class="modal-content">
        <button class="close-modal-btn" onclick="closeWinModal()">✕</button>
        <h2>🎉 SYSTEM UNLOCKED!</h2>
        <p id="loot-message"></p>
        <hr style="border-color: #334155; margin: 12px 0;">
        <p style="color: #94a3b8; font-size: 11px;">
            📦 <b>Физический лут:</b> Передам в живую :)
        </p>
    </div>
</div>

<script>
    let pyodide = null;
    let isWon = false; // Флаг победы
    const consoleEl = document.getElementById('console');
    const codeTextarea = document.getElementById('code');
    const toggleWinBtn = document.getElementById('toggle-win-btn');
    const winModal = document.getElementById('win-modal');

    // Функция сброса состояния победы при изменении кода
    function resetWinState() {
        if (isWon) {
            isWon = false;
            winModal.style.display = 'none';
            toggleWinBtn.style.display = 'none';
        }
    }

    // Сбрасываем победу при любых изменениях в текстовом поле
    codeTextarea.addEventListener('input', resetWinState);

    // Скрываем хедер при фокусе в редакторе для максимального пространства
    codeTextarea.addEventListener('focus', () => {
        document.body.classList.add('editing');
    });

    codeTextarea.addEventListener('blur', () => {
        document.body.classList.remove('editing');
    });

    // Управление модалкой победы
    function closeWinModal() {
        winModal.style.display = 'none';
    }

    function toggleWinModal() {
        if (winModal.style.display === 'flex') {
            winModal.style.display = 'none';
        } else {
            winModal.style.display = 'flex';
        }
    }

    // Инициализация Pyodide и загрузка скрытого декоратора
    let stdoutBuffer = []; // Массив для сбора логов print()

    async function initPyodide() {
        try {
            // Настраиваем перехват print() в массив stdoutBuffer
            pyodide = await loadPyodide({
                stdout: (text) => {
                    stdoutBuffer.push(text);
                }
            });

            await pyodide.runPythonAsync(`
import sys
import types

secret_module = types.ModuleType("secret_guard")

class BaseGuest:
    """Базовый класс гостя. Содержит список inventory"""
    pass

# Скрытые константы в модуле
secret_module.BaseGuest = BaseGuest
secret_module._CITY_CODES = [83, 80, 66]
secret_module._CALC = lambda age: (45**2 + 1) + 12347 * (age - 17) + 56789 * ((age - 17)**2)
def _secret_decorator(func):
    def wrapper(*args, **kwargs):
        u = kwargs.get('user') if 'user' in kwargs else (args[0] if args else None)
        if not u:
            raise TypeError("[ERR_01] SystemError: null reference exception. Argument 'user' evaluated to None. :(")

        if not isinstance(u, BaseGuest):
            raise TypeError(f"[ERR_02] TypeError: memory layout violation. Expected subclass of <class 'BaseGuest'>, received <class '{type(u).__name__}'>. :/")

        if not hasattr(u, 'inventory') or "pyshka" not in u.inventory:
            raise LookupError("[ERR_03] OutOfBoundsException: target buffer missing mandatory asset descriptor -> 'pyshka'. :)")

        if not hasattr(u, 'date'):
            raise AttributeError("[ERR_04] AttributeError: missing mandatory string attribute 'date' (e.g. format 'YYYY-MM-DD'). :_(")

        if not isinstance(u.date, bool) or u.date is not True:
            raise TypeError(f"[ERR_05] SchemaValidationError: attribute 'date' expected boolean flag True, received {type(u.date).__name__}. Gotcha! :_)")

        if not hasattr(u, 'get_passcode') or not callable(u.get_passcode):
            raise NotImplementedError("[ERR_06] SystemError: virtual method table corruption. Missing callable signature 'get_passcode()'. :/")

        val = str(u.get_passcode())

        # Строгая подсказка про длину = 7 и отсылка к константам модуля
        if len(val) != 7:
            raise PermissionError("[ERR_07] SecurityViolationException: invalid auth token structure. Token length must be 7 characters. Look into module constants for hash keys. :(")

        expected_prefix = "".join([chr(x) for x in secret_module._CITY_CODES])
        expected_token = f"{expected_prefix}{secret_module._CALC(17)}"

        if val != expected_token:
            raise PermissionError("[ERR_08] SecurityViolationException: token hash mismatch. Access credentials invalid. Check secret_guard module attributes! :(")

        return func(*args, **kwargs)

    return wrapper

@_secret_decorator
def get_birthday_loot(user=None):
    url = "https://telegra.ph/100-SUCCESS-08-27"
    return f'С Днем Рождения! 🎉 Защита пробита!<br><br>👉 <a href="{url}" target="_blank" style="color: #38bdf8; text-decoration: underline;">Читать поздравление</a>'

secret_module.get_birthday_loot = get_birthday_loot
sys.modules["secret_guard"] = secret_module
`);

            consoleEl.innerText = "Python готов! Нажмите [EXECUTE CODE] для старта.";
            consoleEl.classList.add("success");
        } catch (err) {
            consoleEl.innerText = "Ошибка загрузки Python: " + err;
            consoleEl.classList.add("err");
        }
    }

    initPyodide();

    async function runPython() {
        if (!pyodide) return;

        resetWinState();
        codeTextarea.blur();

        stdoutBuffer = []; // Очищаем буфер принтов
        consoleEl.className = "console";
        consoleEl.innerText = "Выполнение...";
        const userCode = codeTextarea.value;

        try {
            await pyodide.runPythonAsync(userCode);
            let result = await pyodide.runPythonAsync("solution()");

            if (typeof result !== 'string' || !result.includes("С Днем Рождения")) {
                throw new Error("Решение неверное: функция solution() должна возвращать победную строку!");
            }

            isWon = true;

            // Очищаем консоль
            consoleEl.innerHTML = "";

            // 1. Выводим print() белым цветом
            if (stdoutBuffer.length > 0) {
                const printSpan = document.createElement("div");
                printSpan.style.color = "#f8fafc"; // Белый текст для print()
                printSpan.textContent = stdoutBuffer.join("\n");
                consoleEl.appendChild(printSpan);
            }

            // 2. Выводим успех зелёным цветом
            const successSpan = document.createElement("div");
            successSpan.className = "success";
            successSpan.textContent = ">> SUCCESS: " + result;
            consoleEl.appendChild(successSpan);

            confetti({particleCount: 100, spread: 70, origin: {y: 0.6}});
            document.getElementById('loot-message').innerHTML = result;
            setTimeout(() => {
                winModal.style.display = 'flex';
                toggleWinBtn.style.display = 'flex';
            }, 500);

        } catch (err) {
            let errLines = err.message.trim().split('\n');
            let lastError = errLines[errLines.length - 1];

            // Очищаем консоль
            consoleEl.innerHTML = "";

            // 1. Выводим print() белым цветом
            if (stdoutBuffer.length > 0) {
                const printSpan = document.createElement("div");
                printSpan.style.color = "#f8fafc"; // Белый текст для print()
                printSpan.textContent = stdoutBuffer.join("\n");
                consoleEl.appendChild(printSpan);
            }

            // 2. Выводим ошибку красным цветом
            const errSpan = document.createElement("div");
            errSpan.className = "err";
            errSpan.textContent = ">> " + lastError;
            consoleEl.appendChild(errSpan);
        }
    }

    // Инициализация Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
</script>
</body>
</html>
